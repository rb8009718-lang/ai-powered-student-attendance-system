<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Attendance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
:root{--bg:#efead9;--deep:#1f332c;--deep2:#172622;--ink:#20241f;--soft:#4b5147;--gold:#b8863b;--gold2:#d9b876;--line:#c9bfa0;--card:#fbf9f2;--ok:#3f7d52;--warn:#b9832a;--danger:#a63d33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",sans-serif}h1,h2,h3{font-family:Fraunces,serif}button,input,select{font:inherit}.hidden{display:none!important}
.landing{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 20%,#b8863b1a,transparent 45%),var(--deep)}
.hero{width:min(920px,100%);background:var(--card);display:grid;grid-template-columns:1fr 1fr;border-radius:5px;overflow:hidden;box-shadow:0 24px 60px #0006}.hero-left{background:var(--deep);color:#f4ead2;padding:48px}.hero-left h1{font-size:48px;line-height:1;margin:18px 0}.hero-left p{color:#f4ead2a8;line-height:1.6}.hero-right{padding:48px;display:grid;gap:14px;align-content:center}.role{padding:22px;border:1px solid var(--line);background:#fff;text-align:left;cursor:pointer;border-radius:3px}.role:hover{border-color:var(--gold);transform:translateY(-1px)}.role strong{font:600 21px Fraunces}.role small{display:block;color:var(--soft);margin-top:5px}
.modal-bg{position:fixed;inset:0;background:#17262299;display:none;place-items:center;padding:20px;z-index:50}.modal-bg.show{display:grid}.modal{width:min(440px,100%);background:var(--card);padding:28px;border-radius:4px}.close{float:right;border:0;background:none;font-size:20px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--soft);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);background:#fff;border-radius:3px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;cursor:pointer}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.outline{background:transparent;color:var(--ink);border-color:var(--line)}.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:var(--deep);color:#f4ead2;padding:25px 18px;display:flex;flex-direction:column}.brand{font:600 21px Fraunces;padding:0 6px 18px;border-bottom:1px solid #d9b87633}.role-label{font:11px monospace;color:var(--gold2);padding:15px 6px}.nav{border:0;background:transparent;color:#f4ead2bf;text-align:left;padding:11px 12px;border-radius:3px;cursor:pointer}.nav.active,.nav:hover{background:#d9b8761f;color:#fff}.spacer{flex:1}.main{padding:34px 40px;max-width:1250px}.head{margin-bottom:25px}.head h1{font-size:29px;margin:0}.head p{color:var(--soft);font-size:14px}.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);padding:22px;border-radius:3px}.stat{font:34px Fraunces;margin-top:10px}.muted{color:var(--soft);font-size:12px}.section{margin:28px 0 12px;color:var(--soft);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:8px}.table{overflow:auto;background:var(--card);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--soft)}.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tag{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;cursor:pointer}.tag.active{background:var(--ink);color:#fff}.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:600}.ok{background:#e3ede3;color:var(--ok)}.warn{background:#f3e6cd;color:var(--warn)}.danger{background:#f2ded9;color:var(--danger)}
.meter{margin-top:12px}.meter-top{display:flex;justify-content:space-between}.track{height:10px;margin:9px 0;background:linear-gradient(to right,#f2ded9 0 50%,#f3e6cd 50% 75%,#e3ede3 75%);border:1px solid var(--line);position:relative}.fill{height:100%;background:#20241f40}.dot{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #20241f;transform:translateX(-50%)}.cam{background:#111;aspect-ratio:4/3;max-width:430px;position:relative;overflow:hidden}.cam video{width:100%;height:100%;object-fit:cover}.cam-status{position:absolute;bottom:0;left:0;right:0;background:#0009;color:#fff;padding:8px;font:11px monospace}.feed{max-height:330px;overflow:auto}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 16px;border-radius:3px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero-left{padding:35px}.hero-right{padding:28px}.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:20}.main{padding:24px 18px}.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="landing" class="landing">
  <div class="hero">
    <div class="hero-left"><div style="font:12px monospace;color:#d9b876aa">AI ATTENDANCE · FULL STACK</div><h1>The Register</h1><p>Modern attendance management with persistent SQLite storage, secure sessions, marks, eligibility analytics and optional face recognition.</p><small>Express API · SQLite database · JWT authentication</small></div>
    <div class="hero-right">
      <button class="role" onclick="openLogin('teacher')"><strong>Teacher</strong><small>Manage subjects, students, attendance and marks →</small></button>
      <button class="role" onclick="openLogin('student')"><strong>Student</strong><small>View attendance, marks and exam eligibility →</small></button>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-bg">
  <div class="modal">
    <button class="close" onclick="closeLogin()">✕</button>
    <h2 id="loginTitle">Teacher login</h2>
    <div id="teacherForm">
      <div class="field"><label>Name</label><input id="teacherName" placeholder="e.g. Mrs. Iyer"></div>
      <div class="field"><label>Password</label><input id="teacherPassword" type="password" placeholder="Minimum 6 characters"></div>
      <button class="btn gold" style="width:100%" onclick="teacherLogin()">Login</button>
      <p class="muted">New teacher? <button class="btn outline" onclick="teacherRegister()">Create account</button></p>
    </div>
    <div id="studentForm" class="hidden">
      <div class="field"><label>Roll number</label><input id="studentRoll" placeholder="e.g. 21CS045"></div>
      <div class="field"><label>Student PIN</label><input id="studentPin" type="password" placeholder="Your enrollment PIN"></div>
      <button class="btn gold" style="width:100%" onclick="studentLogin()">View my record</button>
    </div>
  </div>
</div>

<div id="app" class="hidden"><div class="shell"><aside id="sidebar" class="sidebar"></aside><main id="main" class="main"></main></div></div>
<div id="toast" class="toast"></div>

<script>
const API="/api";
let token=localStorage.getItem("attendance_token");
let state={role:null,user:null,subjects:[],students:[],attendance:[],marks:[],view:"dashboard",subjectId:null,stream:null,models:false,marksMap:{}};
const FLOOR=50, ELIGIBLE=75;

async function api(path,opts={}) {
  const headers={"Content-Type":"application/json",...(opts.headers||{})};
  if(token) headers.Authorization="Bearer "+token;
  const r=await fetch(API+path,{...opts,headers});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||"Request failed");
  return data;
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove("show"),2500)}
function openLogin(role){document.getElementById("loginModal").classList.add("show");document.getElementById("loginTitle").textContent=role==="teacher"?"Teacher login":"Student login";document.getElementById("teacherForm").classList.toggle("hidden",role!=="teacher");document.getElementById("studentForm").classList.toggle("hidden",role!=="student")}
function closeLogin(){document.getElementById("loginModal").classList.remove("show")}
async function teacherRegister(){const name=document.getElementById("teacherName").value.trim(),password=document.getElementById("teacherPassword").value;if(!name||password.length<6)return toast("Enter name and a 6+ character password.");try{const d=await api("/auth/teacher/register",{method:"POST",body:JSON.stringify({name,password})});loginSuccess(d,"teacher")}catch(e){toast(e.message)}}
async function teacherLogin(){const name=document.getElementById("teacherName").value.trim(),password=document.getElementById("teacherPassword").value;try{const d=await api("/auth/teacher/login",{method:"POST",body:JSON.stringify({name,password})});loginSuccess(d,"teacher")}catch(e){toast(e.message)}}
async function studentLogin(){const roll=document.getElementById("studentRoll").value.trim(),pin=document.getElementById("studentPin").value;try{const d=await api("/auth/student/login",{method:"POST",body:JSON.stringify({roll,pin})});loginSuccess(d,"student")}catch(e){toast(e.message)}}
async function loginSuccess(d,role){token=d.token;localStorage.setItem("attendance_token",token);state.role=role;state.user=d.user;closeLogin();await load();enter()}
async function load(){const d=await api("/bootstrap");state.subjects=d.subjects;state.students=d.students;state.attendance=d.attendance;state.marks=d.marks;if(state.role==="student")state.student=state.students.find(s=>s.id===state.user.id)}
function logout(){stopCam();localStorage.removeItem("attendance_token");token=null;location.reload()}
function enter(){document.getElementById("landing").classList.add("hidden");document.getElementById("app").classList.remove("hidden");renderSidebar();render()}
const teacherNav=[["dashboard","Dashboard"],["subjects","Manage subjects"],["enroll","Enroll students"],["attend","Take attendance"],["marks","Enter marks"],["history","Attendance history"]];
const studentNav=[["dashboard","My eligibility"],["marks","My marks"],["history","My history"]];
function renderSidebar(){const nav=state.role==="teacher"?teacherNav:studentNav;document.getElementById("sidebar").innerHTML=`<div class="brand">The Register</div><div class="role-label">${state.role.toUpperCase()} VIEW</div>${nav.map(n=>`<button class="nav ${state.view===n[0]?"active":""}" onclick="setView('${n[0]}')">${n[1]}</button>`).join("")}<div class="spacer"></div><div class="muted" style="color:#f4ead288;padding:8px">${state.user.name}${state.user.roll?" · "+state.user.roll:""}</div><button class="btn outline" style="color:#f4ead2;border-color:#d9b87655" onclick="logout()">Log out</button>`}
function setView(v){stopCam();state.view=v;state.subjectId=null;renderSidebar();render()}
function render(){const m=document.getElementById("main");if(state.role==="teacher"){m.innerHTML=state.view==="dashboard"?teacherDash():state.view==="subjects"?subjectsView():state.view==="enroll"?enrollView():state.view==="attend"?attendView():state.view==="marks"?marksView(true):historyView(true);if(state.view==="enroll")initEnrollCam()}else m.innerHTML=state.view==="dashboard"?studentDash():state.view==="marks"?marksView(false):historyView(false)}
function att(sid,subid){const r=state.attendance.filter(a=>a.studentId===sid&&a.subjectId===subid),held=r.length,present=r.filter(x=>x.status==="present").length;return{held,present,pct:held?Math.round(present/held*1000)/10:0}}
function status(p){return p<50?["danger","Debarred"]:p<75?["warn","Condonable"]:["ok","Eligible"]}
function needed(p,h,target){if(!h)return 0;let x=p,n=h,c=0;while(x/n*100<target&&c<500){x++;n++;c++}return c}
function meter(sub,p,h){const st=status(p),need=needed(p,h,st[0]==="danger"?50:75),color=st[0]==="danger"?"var(--danger)":st[0]==="warn"?"var(--warn)":"var(--ok)";return `<div class="meter"><div class="meter-top"><b>${sub}</b><span>${p}% <span class="badge ${st[0]}">${st[1]}</span></span></div><div class="track"><div class="fill" style="width:${Math.min(100,p)}%"></div><div class="dot" style="left:${Math.min(100,p)}%;background:${color}"></div></div><div class="muted">${h?`${h} held · ${Math.round(p*h/100)} present`:"No classes recorded yet."}</div><p class="muted">${p<50?`Need ${need} consecutive present class${need===1?"":"es"} to reach 50%.`:p<75?`Need ${need} consecutive present class${need===1?"":"es"} to reach 75%.`:"Clear to sit the exam."}</p></div>`}
function teacherDash(){const today=new Date().toISOString().slice(0,10),todayN=state.attendance.filter(a=>a.date===today).length;const risk=state.students.filter(s=>state.subjects.some(sub=>att(s.id,sub.id).held&&att(s.id,sub.id).pct<75));return `<div class="head"><h1>Good day, ${state.user.name.split(" ")[0]}</h1><p>Live overview of your attendance register.</p></div><div class="grid g3"><div class="card"><b>Enrolled students</b><div class="stat">${state.students.length}</div><div class="muted">${state.subjects.length} subjects</div></div><div class="card"><b>Marked today</b><div class="stat">${todayN}</div><div class="muted">attendance entries</div></div><div class="card"><b>Below 75%</b><div class="stat">${risk.length}</div><div class="muted">students needing attention</div></div></div><div class="section">Students to watch</div>${risk.length?`<div class="table"><table><tr><th>Student</th><th>Roll</th>${state.subjects.map(s=>`<th>${s.name}</th>`).join("")}</tr>${risk.map(s=>`<tr><td>${s.name}</td><td>${s.roll}</td>${state.subjects.map(sub=>{const a=att(s.id,sub.id);return `<td>${a.held?`<span class="badge ${status(a.pct)[0]}">${a.pct}%</span>`:"—"}</td>`}).join("")}</tr>`).join("")}</table></div>`:`<div class="card">Everyone is currently above the 75% line.</div>`}`}
function subjectsView(){return `<div class="head"><h1>Manage subjects</h1><p>Subjects are now stored in SQLite on the server.</p></div><div class="card" style="max-width:430px"><div class="field"><label>Subject name</label><input id="newSub" placeholder="e.g. Data Structures"></div><button class="btn gold" onclick="addSubject()">Add subject</button></div><div class="section">All subjects</div><div class="table"><table><tr><th>Subject</th><th>Enrolled</th><th></th></tr>${state.subjects.map(s=>`<tr><td>${s.name}</td><td>${state.students.filter(x=>x.subjectIds.includes(s.id)).length}</td><td><button class="btn danger" onclick="removeSubject(${s.id})">Remove</button></td></tr>`).join("")}</table></div>`}
async function addSubject(){const name=document.getElementById("newSub").value.trim();if(!name)return toast("Enter a subject name.");try{await api("/subjects",{method:"POST",body:JSON.stringify({name})});await load();render();toast("Subject added.")}catch(e){toast(e.message)}}
async function removeSubject(id){if(!confirm("Remove this subject?"))return;try{await api("/subjects/"+id,{method:"DELETE"});await load();render()}catch(e){toast(e.message)}}
function enrollView(){return `<div class="head"><h1>Enroll students</h1><p>Add subjects, a secure student PIN and an optional face descriptor.</p></div><div class="grid g2"><div class="card"><div class="field"><label>Full name</label><input id="newName" placeholder="Aarav Mehta"></div><div class="field"><label>Roll number</label><input id="newRoll" placeholder="21CS045"></div><div class="field"><label>Student PIN (4+ digits/characters)</label><input id="newPin" type="password" placeholder="Student login PIN"></div><div class="field"><label>Subjects</label><select id="newSubs" multiple size="${Math.max(3,state.subjects.length)}">${state.subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select></div><div class="field"><label>Face capture</label><div class="cam"><video id="enrollVideo" autoplay muted playsinline></video><div id="enrollStatus" class="cam-status">Starting camera…</div></div><button class="btn outline" style="margin-top:10px" onclick="captureFace()">Capture face</button><span id="faceState" class="muted" style="margin-left:8px">Not captured</span></div><button class="btn gold" onclick="saveStudent()">Save student</button></div><div class="card"><h3>Enrolled students</h3><div class="feed">${state.students.map(s=>`<div class="row"><div><b>${s.name}</b><div class="muted">${s.roll} · ${s.faceDescriptor?"face on file":"manual attendance"}</div></div><button class="btn danger" onclick="removeStudent(${s.id})">Remove</button></div>`).join("")||"<div class='muted'>No students yet.</div>"}</div></div></div>`}
let captured=null;
async function ensureModels(){if(state.models)return true;try{const u="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(u),faceapi.nets.faceLandmark68Net.loadFromUri(u),faceapi.nets.faceRecognitionNet.loadFromUri(u)]);state.models=true;return true}catch{return false}}
async function initEnrollCam(){captured=null;const v=document.getElementById("enrollVideo");if(!v)return;try{state.stream=await navigator.mediaDevices.getUserMedia({video:{width:400,height:300}});v.srcObject=state.stream;document.getElementById("enrollStatus").textContent="Camera ready";}catch{document.getElementById("enrollStatus").textContent="Camera unavailable — manual attendance is still available."}}
async function captureFace(){const v=document.getElementById("enrollVideo");if(!v?.srcObject)return toast("Camera is not active.");if(!await ensureModels())return toast("Face model could not load.");const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!d)return toast("No face detected. Try better lighting.");captured=Array.from(d.descriptor);document.getElementById("faceState").textContent="✓ Captured"}
function stopCam(){if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}}
async function saveStudent(){const name=document.getElementById("newName").value.trim(),roll=document.getElementById("newRoll").value.trim(),pin=document.getElementById("newPin").value,subjectIds=[...document.getElementById("newSubs").selectedOptions].map(x=>Number(x.value));if(!name||!roll||!pin||subjectIds.length===0)return toast("Complete all required fields.");try{await api("/students",{method:"POST",body:JSON.stringify({name,roll,pin,subjectIds,faceDescriptor:captured})});stopCam();await load();render();toast("Student enrolled.")}catch(e){toast(e.message)}}
async function removeStudent(id){if(!confirm("Remove this student and their records?"))return;try{await api("/students/"+id,{method:"DELETE"});await load();render()}catch(e){toast(e.message)}}
let attendMarks={},scanTimer=null;
function attendView(){if(!state.subjects.length)return `<div class="head"><h1>Take attendance</h1></div><div class="card">Add a subject first.</div>`;const sid=state.subjectId||state.subjects[0].id;state.subjectId=sid;const roster=state.students.filter(s=>s.subjectIds.includes(sid));roster.forEach(s=>{if(!attendMarks[s.id])attendMarks[s.id]="absent"});return `<div class="head"><h1>Take attendance</h1><p>Use face scanning or manual controls, then save one complete session to the database.</p></div><div class="tagrow">${state.subjects.map(s=>`<button class="tag ${s.id===sid?"active":""}" onclick="state.subjectId=${s.id};render()">${s.name}</button>`).join("")}</div><div class="field" style="max-width:220px"><label>Date</label><input id="attDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="grid g2"><div class="card"><h3>Live face scan</h3><div class="cam" style="margin-top:10px"><video id="attVideo" autoplay muted playsinline></video><div id="attStatus" class="cam-status">Camera off</div></div><button class="btn outline" style="margin-top:10px" onclick="startScan()">Start scanning</button> <button class="btn outline" onclick="pauseScan()">Pause</button><div id="scanFeed" class="feed"></div></div><div class="card"><h3>Roster · ${roster.length}</h3><div class="feed">${roster.map(s=>rowMark(s)).join("")}</div><button class="btn gold" style="margin-top:14px" onclick="saveAttendance()">Save attendance</button></div></div>`}
function rowMark(s){const m=attendMarks[s.id]||"absent";return `<div class="row" id="r${s.id}"><div><b>${s.name}</b><div class="muted">${s.roll}</div></div><div><button class="btn ${m==="present"?"gold":"outline"}" onclick="mark(${s.id},'present')">P</button> <button class="btn ${m==="absent"?"danger":"outline"}" onclick="mark(${s.id},'absent')">A</button></div></div>`}
function mark(id,v){attendMarks[id]=v;const e=document.getElementById("r"+id);const s=state.students.find(x=>x.id===id);e.outerHTML=rowMark(s)}
async function startScan(){const v=document.getElementById("attVideo"),st=document.getElementById("attStatus"),roster=state.students.filter(s=>s.subjectIds.includes(state.subjectId)&&s.faceDescriptor);if(!roster.length)return toast("No faces are enrolled for this subject.");try{state.stream=state.stream||await navigator.mediaDevices.getUserMedia({video:{width:400,height:300}});v.srcObject=state.stream;if(!await ensureModels())return toast("Face model could not load.");const labeled=roster.map(s=>new faceapi.LabeledFaceDescriptors(String(s.id),[new Float32Array(s.faceDescriptor)])),matcher=new faceapi.FaceMatcher(labeled,.55);st.textContent="Scanning…";clearInterval(scanTimer);scanTimer=setInterval(async()=>{if(!v.srcObject)return;const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!d)return;const best=matcher.findBestMatch(d.descriptor);if(best.label!=="unknown"){const id=Number(best.label);attendMarks[id]="present";const e=document.getElementById("r"+id);if(e)e.outerHTML=rowMark(state.students.find(x=>x.id===id));document.getElementById("scanFeed").insertAdjacentHTML("afterbegin",`<div class="row"><span>${state.students.find(x=>x.id===id)?.name}</span><span class="badge ok">present</span></div>`) }},1400)}catch{st.textContent="Camera unavailable — use manual controls."}}
function pauseScan(){clearInterval(scanTimer);scanTimer=null;const s=document.getElementById("attStatus");if(s)s.textContent="Paused"}
async function saveAttendance(){const date=document.getElementById("attDate").value,records=state.students.filter(s=>s.subjectIds.includes(state.subjectId)).map(s=>({studentId:s.id,status:attendMarks[s.id]||"absent"}));try{await api("/attendance",{method:"PUT",body:JSON.stringify({subjectId:state.subjectId,date,records})});clearInterval(scanTimer);stopCam();await load();render();toast("Attendance saved to database.")}catch(e){toast(e.message)}}
function marksView(teacher){const sid=state.subjectId||state.subjects[0]?.id;if(!sid)return `<div class="card">No subjects yet.</div>`;state.subjectId=sid;if(!teacher){const s=state.student;return `<div class="head"><h1>My marks</h1><p>Scores entered by your teacher.</p></div><div class="table"><table><tr><th>Subject</th><th>Marks</th><th>Attendance</th><th>Status</th></tr>${state.subjects.map(sub=>{const m=state.marks.find(x=>x.studentId===s.id&&x.subjectId===sub.id),a=att(s.id,sub.id);return `<tr><td>${sub.name}</td><td>${m?m.score+" / 100":"—"}</td><td>${a.pct}%</td><td><span class="badge ${status(a.pct)[0]}">${status(a.pct)[1]}</span></td></tr>`}).join("")}</table></div>`}const roster=state.students.filter(s=>s.subjectIds.includes(sid));return `<div class="head"><h1>Enter marks</h1><p>Marks are persisted in SQLite.</p></div><div class="tagrow">${state.subjects.map(s=>`<button class="tag ${s.id===sid?"active":""}" onclick="state.subjectId=${s.id};render()">${s.name}</button>`).join("")}</div><div class="table"><table><tr><th>Student</th><th>Roll</th><th>Marks / 100</th><th></th></tr>${roster.map(s=>{const m=state.marks.find(x=>x.studentId===s.id&&x.subjectId===sid);return `<tr><td>${s.name}</td><td>${s.roll}</td><td><input id="mk${s.id}" type="number" min="0" max="100" value="${m?m.score:""}" style="width:100px;padding:7px"></td><td><button class="btn outline" onclick="saveMark(${s.id},${sid})">Save</button></td></tr>`}).join("")}</table></div>`}
async function saveMark(studentId,subjectId){const score=Number(document.getElementById("mk"+studentId).value);if(!Number.isFinite(score)||score<0||score>100)return toast("Marks must be 0–100.");try{await api("/marks",{method:"PUT",body:JSON.stringify({studentId,subjectId,score})});await load();toast("Mark saved.")}catch(e){toast(e.message)}}
function historyView(teacher){const relevant=teacher?state.subjects:state.subjects.filter(s=>state.student.subjectIds.includes(s.id)),sid=state.subjectId||relevant[0]?.id;if(!sid)return `<div class="card">No subjects yet.</div>`;state.subjectId=sid;let recs=state.attendance.filter(a=>a.subjectId===sid);if(!teacher)recs=recs.filter(a=>a.studentId===state.student.id);const dates=[...new Set(recs.map(a=>a.date))].sort().reverse();return `<div class="head"><h1>${teacher?"Attendance history":"My history"}</h1><p>Database-backed attendance history.</p></div><div class="tagrow">${relevant.map(s=>`<button class="tag ${s.id===sid?"active":""}" onclick="state.subjectId=${s.id};render()">${s.name}</button>`).join("")}</div><div class="table"><table><tr><th>Date</th>${teacher?"<th>Present</th><th>Absent</th><th>%</th>":"<th>Status</th>"}</tr>${dates.map(d=>{const rs=recs.filter(a=>a.date===d);if(teacher){const p=rs.filter(x=>x.status==="present").length,t=rs.length;return `<tr><td>${d}</td><td>${p}</td><td>${t-p}</td><td>${t?Math.round(p/t*100):0}%</td></tr>`}const r=rs[0];return `<tr><td>${d}</td><td><span class="badge ${r.status==="present"?"ok":"danger"}">${r.status}</span></td></tr>`}).join("")}</table></div>`}
function studentDash(){const s=state.student,my=state.subjects.filter(x=>s.subjectIds.includes(x.id)),all=state.attendance.filter(a=>a.studentId===s.id),overall=all.length?Math.round(all.filter(a=>a.status==="present").length/all.length*1000)/10:0;return `<div class="head"><h1>Welcome, ${s.name.split(" ")[0]}</h1><p>Your attendance is calculated subject-wise. 50% is the mandatory floor and 75% is the eligible line.</p></div><div class="grid g3"><div class="card"><b>Overall attendance</b><div class="stat">${overall}%</div><div class="muted">all subjects</div></div><div class="card"><b>Subjects</b><div class="stat">${my.length}</div><div class="muted">enrolled</div></div><div class="card"><b>Eligible now</b><div class="stat">${my.filter(sub=>att(s.id,sub.id).pct>=75).length}/${my.length}</div><div class="muted">at or above 75%</div></div></div><div class="section">Subject-wise eligibility</div><div class="grid g2">${my.map(sub=>{const a=att(s.id,sub.id);return `<div class="card">${meter(sub.name,a.pct,a.held)}</div>`}).join("")||"<div class='card'>No subjects enrolled.</div>"}</div>`}
if(token){api("/bootstrap").then(d=>{state.role=JSON.parse(atob(token.split(".")[1])).role;state.user=JSON.parse(atob(token.split(".")[1]));return load()}).then(enter).catch(()=>{localStorage.removeItem("attendance_token");token=null})}
</script>
</body>
</html>
